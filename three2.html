<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Perfect 45 PCB Grid</title>
    <style>
        body { margin: 0; background-color: #ffffff; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- Scene Setup ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 25);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio); 
    renderer.setClearColor(0xffffff, 1);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // --- Grid Logic ---
    const occupied = new Set();
    const UNIT = 0.7;
    // We use a precision-safe hash for the grid
    const getHash = (x, y) => `${Math.round(x * 10)},${Math.round(y * 10)}`;

    let wires = [];

    class VerticalWire {
        constructor(x = 0, y = -10, dir = {x:0, y:1}, gen = 0) {
            this.curr = new THREE.Vector3(x, y, 0);
            this.points = [this.curr.clone()];
            this.dir = dir; 
            this.gen = gen;
            this.active = true;
            this.steps = 0;
            this.progress = 0;
            this.history = [];
            
            this.geometry = new THREE.BufferGeometry().setFromPoints(this.points);
            this.material = new THREE.LineBasicMaterial({ 
                color: 0x0055ff, 
                transparent: true, 
                opacity: 0.8,
                linewidth: 2 
            });
            this.line = new THREE.Line(this.geometry, this.material);
            scene.add(this.line);

            // Start Dot
            this.addNode(x, y, 0.15, true);
        }

        update() {
            if (!this.active) {
                this.material.opacity -= 0.002;
                if (this.material.opacity <= 0) this.dispose();
                return;
            }

            this.progress += 0.2; // Growth Speed

            if (this.progress >= 1) {
                this.progress = 0;
                
                // Calculate step: If diagonal, distance is UNIT * 1.414 to keep 45 deg angle perfect
                const isDiag = this.dir.x !== 0;
                const stepX = this.dir.x * UNIT;
                const stepY = UNIT; // Always move up by 1 unit
                
                const nextX = this.curr.x + stepX;
                const nextY = this.curr.y + stepY;
                const h = getHash(nextX, nextY);

                // LOOK-AHEAD COLLISION
                if (occupied.has(h) || nextY > 12) {
                    this.active = false;
                    this.addNode(this.curr.x, this.curr.y, 0.1, false); // End node
                } else {
                    occupied.add(h);
                    this.history.push(h);
                    this.curr.set(nextX, nextY, 0);
                    this.points.push(this.curr.clone());
                    this.steps++;

                    // Logical Branching
                    if (this.steps % 4 === 0) {
                        if (Math.random() > 0.7 && this.gen < 5) this.spawnBranch();
                        else if (Math.random() > 0.5) this.toggleDiagonal();
                    }
                }
            } else {
                const stepX = this.dir.x * UNIT * this.progress;
                const stepY = UNIT * this.progress;
                const tip = new THREE.Vector3(this.curr.x + stepX, this.curr.y + stepY, 0);
                
                if (this.points.length === this.steps + 1) this.points.push(tip);
                else this.points[this.points.length - 1].copy(tip);
            }
            this.geometry.setFromPoints(this.points);
        }

        toggleDiagonal() {
            // Switch between straight up (0) and perfect 45 (1 or -1)
            if (this.dir.x === 0) {
                this.dir.x = Math.random() > 0.5 ? 1 : -1;
            } else {
                this.dir.x = 0;
            }
        }

        spawnBranch() {
            const side = Math.random() > 0.5 ? 1 : -1;
            const branchDir = { x: side, y: 1 };
            
            // Branch look-ahead: only spawn if the immediate diagonal space is clear
            const branchX = this.curr.x + (side * UNIT);
            const branchY = this.curr.y + UNIT;
            
            if (!occupied.has(getHash(branchX, branchY))) {
                wires.push(new VerticalWire(this.curr.x, this.curr.y, branchDir, this.gen + 1));
            }
        }

        addNode(x, y, size, isStart) {
            const geo = isStart ? new THREE.CircleGeometry(size, 16) : new THREE.RingGeometry(size/2, size, 16);
            const mat = new THREE.MeshBasicMaterial({ color: 0x0088ff, transparent: true });
            const node = new THREE.Mesh(geo, mat);
            node.position.set(x, y, 0.01); // Slightly in front
            scene.add(node);
            this.nodes = this.nodes || [];
            this.nodes.push(node);
        }

        dispose() {
            this.history.forEach(h => occupied.delete(h));
            scene.remove(this.line);
            if (this.nodes) this.nodes.forEach(n => scene.remove(n));
            this.geometry.dispose();
            this.material.dispose();
            wires = wires.filter(w => w !== this);
        }
    }

    // --- Spawn Management ---
    function spawn() {
        if (wires.length < 30) {
            const xPos = (Math.floor(Math.random() * 20) - 10) * UNIT;
            if (!occupied.has(getHash(xPos, -12))) {
                wires.push(new VerticalWire(xPos, -12));
            }
        }
        setTimeout(spawn, 1000);
    }
    spawn();

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        for(let i = wires.length - 1; i >= 0; i--) wires[i].update();
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
